# 🍴 PLANEO FORK ONLY — the golang-adk image of our kagent integration branch `planeo/main`
# (upstream main + https://github.com/planeodev/kagent/pull/2), as a THIN caller of the Vionix reusable
# ohanalabs-ai/github-platform docker-multiarch-cicd.yaml: the `golang-adk` service of docker-compose.planeo.yaml,
# multi-arch → ghcr.io/planeodev/kagent/golang-adk:planeo-main-<sha7> on push (PRs: …/golang-adk/pr/<n>:<sha7>).
# Pin it by that tag + its index digest (planeo-infra CLAUDE.md §9). Retire this file with the fork when upstream
# releases the fixes (planeo-infra .github/upstream-watch-forks.yaml opens the issue).
name: 🍴 planeo-image-golang-adk
run-name: "🍴 golang-adk (planeo fork) — ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name }}"

on:
  pull_request:
    branches: [planeo/main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - go/**
      - docker-compose.planeo.yaml
      - .github/workflows/planeo-image-golang-adk.yml
  push:
    branches: [planeo/main]
    paths:
      - go/**
      - docker-compose.planeo.yaml
      - .github/workflows/planeo-image-golang-adk.yml
  workflow_dispatch:

concurrency:
  group: planeo-image-golang-adk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐳 build
    uses: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write # the reusable's release/tag steps
      packages: write # push to ghcr.io
      id-token: write # OIDC (build identity)
      attestations: write # GitHub attestations (this fork is public)
      artifact-metadata: write # SBOM metadata
      pull-requests: write # PR comment with the image ref
    with:
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      docker-compose-file-name: docker-compose.planeo.yaml
      docker-compose-target-service: golang-adk
      image-name-suffix: golang-adk
      github-job-timeout-minutes: 45
    secrets: inherit
